[sync]
alwaysshowpkgorigin = no
develpkgsexpiration = -1
upgradesorting = versiondiff
showdownloadsize = no
ignoreoutofdateaurupgrades = no

[build]
keepbuilddir = no
keepdevbuilddir = yes
keepbuilddeps = no
gpgdir = 
skipfailedbuild = no
dynamicusers = never
ignorearch = no

[review]
noedit = no
donteditbydefault = yes
nodiff = yes
gitdiffargs = --ignore-space-change,--ignore-all-space
diffpager = auto
hidedifffiles = .SRCINFO

[colors]
version = 10
versiondiffold = 11
versiondiffnew = 9

[ui]
requireenterconfirm = no
printcommands = no
aursearchsorting = hottest
displaylastupdated = yes
groupbyrepository = no
reversesearchsorting = yes
warnaboutpackageupdates = 
warnaboutnondefaultprivilegeescalationtool = yes

[misc]
cachepath = /home/raidr/.cache
datapath = /home/raidr/.local/share
pacmanpath = pacman
privilegeescalationtool = sudo
privilegeescalationtarget = pikaur
userid = 0
groupid = 0
preserveenv = PKGDEST,VISUAL,EDITOR
[network]
aururl = https://aur.archlinux.org
newsurl = https://archlinux.org/feeds/news/
socks5proxy = 
aurhttpproxy = 
aurhttpsproxy = 

