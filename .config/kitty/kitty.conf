include dank-tabs.conf

# Font Configuration
# BEGIN_KITTY_FONTS
font_family      family="EnvyCodeR Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size       13


# Window Configuration
window_padding_width 2 4
window_margin_width 0 0
background_opacity 0.75
background_blur 0
hide_window_decorations yes

# Cursor Configuration
cursor_shape underline
#block/ underline/ beam/
cursor_blink_interval -1
cursor_beam_thickness 4
cursor_underline_thickness 2.0
cursor_shape_unfocused hollow
# cursor_text_color #ffffff


# Progress bar
progress_bar bottom
# left, right, p, bottom, hidden

# Scrollback
scrollback_lines 1000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.1
momentum_scroll 0.05
pixel_scroll yes

# Scrollbar
scrollbar scrolled
# scrolled, hovered, scrolled-and-hovered, always, never

# Scrollbar Colors
# scrollbar_handle_color white
# scrollbar_track_color white

# Scrollbar Size
scrollbar_gap 0
scrollbar_radius 0.5
scrollbar_width 0.4
scrollbar_hover_width 0.5
scrollbar_min_handle_height 5
scrollbar_hitbox_expansion 0.5

# Scrollbar Opacity
scrollbar_track_hover_opacity 0.02
scrollbar_handle_opacity 0.3
scrollbar_track_opacity 0.01

# Terminal features
copy_on_select no
strip_trailing_spaces smart
confirm_os_window_close 0
paste_actions confirm-if-large
# Key bindings for common actions

kitty_mod ctrl+shift
map ctrl+t                             new_tab
map ctrl+plus                          change_font_size all +1.0
map ctrl+minus                         change_font_size all -1.0
map ctrl+0                             change_font_size all 0
map kitty_mod+u                 kitten unicode_input
map ctrl+alt+c                   edit_config_file
map --allow-fallback=shifted,ascii ctrl+enter new_os_window
map --allow-fallback=shifted,ascii ctrl+w close_tab
map ctrl+page_up scroll_page_up
map ctrl+page_down scroll_page_down
map ctrl+home scroll_home
map ctrl+end scroll_end
map ctrl+up                   scroll_line_up smooth
map ctrl+down                 scroll_line_down smooth



# Shell integration
shell_integration enabled

# Dank color generation
# include dank-theme.conf

# Map tab shortcut
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7



# Added by Gogh
#include colors.conf










include themes/noctalia.conf
